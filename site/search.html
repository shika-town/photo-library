<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>写真から探す｜SHIKA PHOTO LIBRARY</title>
<link rel="canonical" href="index.html#find">
<script>
(function () {
  var p = new URLSearchParams(location.search), o = new URLSearchParams();
  ['q', 'spot', 'genre', 'use', 'season', 'tag'].forEach(function (k) { if (p.get(k)) o.set(k, p.get(k)); });
  if (p.get('tags') && !o.get('q')) o.set('q', p.get('tags').split(',').join(' '));   // 旧「目的で探す」のURL
  var qs = o.toString();
  location.replace('index.html#find'.replace('#', (qs ? '?' + qs : '') + '#'));
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=index.html#find"></noscript>
</head>
<body><p><a href="index.html#find">トップページへ移動します</a></p></body>
</html>
