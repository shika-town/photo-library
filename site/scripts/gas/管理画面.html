<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --ink: #1f2937;
      --muted: #64748b;
      --line: #d9e2ec;
      --soft: #f6f8fb;
      --blue: #0b4f82;
      --blue-dark: #08395e;
      --warn: #fff7d6;
      --ok: #e8f5ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #fff;
      font-size: 13px;
    }
    header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0 0 4px; color: var(--blue-dark); font-size: 18px; line-height: 1.4; }
    .lead { margin: 0; color: var(--muted); line-height: 1.7; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px 12px 0; }
    .tab {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      padding: 8px 6px;
      font-weight: 700;
    }
    .tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    main { padding: 14px 16px 20px; }
    section { display: none; }
    section.active { display: block; }
    label { display: block; margin: 12px 0 5px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      color: var(--ink);
      font: inherit;
      background: #fff;
    }
    textarea { min-height: 78px; resize: vertical; line-height: 1.7; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .checks { display: flex; flex-wrap: wrap; gap: 7px; }
    .check {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 9px;
      background: var(--soft);
      font-weight: 600;
    }
    .check input { width: auto; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    button.primary, button.secondary {
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      padding: 10px 12px;
      font-weight: 700;
    }
    button.primary { flex: 1; background: var(--blue); color: #fff; }
    button.primary:hover { background: var(--blue-dark); }
    button.secondary { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
    .hint { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .notice { display: none; margin: 12px 16px 0; padding: 10px; border-radius: 6px; line-height: 1.6; }
    .notice.ok { display: block; background: var(--ok); }
    .notice.err { display: block; background: #fdeaea; }
    .pending { display: grid; gap: 10px; }
    .item { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
    .item h3 { margin: 0 0 6px; font-size: 14px; }
    .meta { color: var(--muted); line-height: 1.6; }
    .pill { display: inline-block; margin-right: 6px; border-radius: 999px; background: var(--warn); padding: 3px 7px; font-weight: 700; }
    .empty { color: var(--muted); background: var(--soft); border-radius: 8px; padding: 16px; line-height: 1.7; }
    .switches { display: grid; gap: 8px; margin: 12px 0; }
    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--soft);
      font-weight: 700;
    }
    .switch span { color: var(--muted); font-size: 12px; font-weight: 600; }
    .switch input { width: auto; transform: scale(1.15); }
  </style>
</head>
<body>
  <header>
    <h1>フォトライブラリー管理</h1>
    <p class="lead">列を触らずに、写真登録・承認・スポット説明の修正ができます。</p>
  </header>
  <div id="notice" class="notice"></div>
  <nav class="tabs">
    <button class="tab active" data-tab="add">写真登録</button>
    <button class="tab" data-tab="photo">写真管理</button>
    <button class="tab" data-tab="approve">承認</button>
    <button class="tab" data-tab="spot">スポット</button>
  </nav>
  <main>
    <section id="tab-add" class="active">
      <label>写真ファイル</label>
      <input id="file" type="file" accept="image/*">
      <p class="hint">ファイルを選ぶと写真フォルダへ保存します。すでにDriveへ置いた写真は下に共有リンクを貼ってください。</p>

      <label>Googleドライブの共有リンクまたはID</label>
      <input id="driveFileId" placeholder="https://drive.google.com/file/d/...">

      <label>タイトル</label>
      <input id="title" placeholder="例：夕暮れの巌門">

      <label>スポット</label>
      <select id="spot"></select>

      <div class="row">
        <div>
          <label>季節</label>
          <select id="season"></select>
        </div>
        <div>
          <label>切り抜き</label>
          <select id="focus"></select>
        </div>
      </div>

      <label>タグ</label>
      <div id="tags" class="checks"></div>

      <label>表示場所</label>
      <div id="roles" class="checks"></div>

      <label>説明・備考</label>
      <textarea id="description" placeholder="撮影場所の補足、人物の写り込みなど"></textarea>

      <div class="row">
        <div>
          <label>撮影者</label>
          <input id="photographer" value="志賀町">
        </div>
        <div>
          <label>並び順</label>
          <input id="sortOrder" type="number" value="9000">
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="addPhoto">非公開で登録</button>
      </div>
    </section>

    <section id="tab-photo">
      <label>編集する写真</label>
      <select id="photoEdit"></select>

      <div class="switches">
        <label class="switch">
          <div>表示<span>OFFにすると公開サイトに出ません。</span></div>
          <input id="photoPublish" type="checkbox">
        </label>
        <label class="switch">
          <div>ダウンロード対象<span>ONの写真だけ公開サイトに表示します。</span></div>
          <input id="photoDownload" type="checkbox">
        </label>
      </div>

      <label>キャプション</label>
      <input id="photoTitle" placeholder="例：夕暮れの巌門">

      <label>説明</label>
      <textarea id="photoDescription" placeholder="写真の補足説明や代替テキスト"></textarea>

      <div class="row">
        <div>
          <label>タグ</label>
          <input id="photoTags" placeholder="夕陽,海,岩">
        </div>
        <div>
          <label>表示場所</label>
          <input id="photoRoles" placeholder="新着,シーン,季節">
        </div>
      </div>

      <label>並び順</label>
      <input id="photoSortOrder" type="number">

      <div class="actions">
        <button class="primary" id="savePhoto">保存</button>
      </div>
    </section>

    <section id="tab-approve">
      <div class="actions">
        <button class="secondary" id="reload">再読み込み</button>
      </div>
      <div id="pending" class="pending"></div>
    </section>

    <section id="tab-spot">
      <label>編集するスポット</label>
      <select id="spotEdit"></select>

      <label>キャッチコピー</label>
      <input id="spotCatch">

      <label>説明文 1</label>
      <textarea id="body1"></textarea>
      <label>説明文 2</label>
      <textarea id="body2"></textarea>
      <label>説明文 3</label>
      <textarea id="body3"></textarea>
      <label>説明文 4</label>
      <textarea id="body4"></textarea>

      <label>大きな写真のID</label>
      <input id="heroPhotoId" placeholder="例：P0031">

      <div class="actions">
        <button class="primary" id="saveSpot">保存</button>
      </div>
    </section>
  </main>

  <script>
    let state = { spots: [], photos: [], choices: {}, pending: [] };
    const $ = id => document.getElementById(id);

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        $('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    function notice(text, ok) {
      const n = $('notice');
      n.textContent = text;
      n.className = 'notice ' + (ok ? 'ok' : 'err');
    }

    function fillSelect(el, values, blank) {
      el.innerHTML = (blank ? '<option value="">選択してください</option>' : '') +
        values.map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('');
    }

    function fillChecks(el, values) {
      el.innerHTML = values.map(v =>
        '<label class="check"><input type="checkbox" value="' + esc(v) + '">' + esc(v) + '</label>'
      ).join('');
    }

    function checked(id) {
      return Array.from($(id).querySelectorAll('input:checked')).map(i => i.value);
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function load() {
      google.script.run.withSuccessHandler(data => {
        state = data;
        fillSelect($('spot'), data.spots.map(s => s.name), true);
        fillSelect($('season'), data.choices.season || [], true);
        fillSelect($('focus'), data.choices.focus || [], false);
        fillChecks($('tags'), data.choices.tags || []);
        fillChecks($('roles'), data.choices.roles || []);
        fillSelect($('spotEdit'), data.spots.map(s => s.name), true);
        fillSelect($('photoEdit'), data.photos.map(p => p.label), true);
        renderPending();
        if ($('photoEdit').value) setPhotoFields();
      }).withFailureHandler(e => notice(e.message, false)).管理画面データを取得する();
    }

    function renderPending() {
      const list = state.pending || [];
      if (!list.length) {
        $('pending').innerHTML = '<div class="empty">承認待ちはありません。</div>';
        return;
      }
      $('pending').innerHTML = list.map((p, i) =>
        '<div class="item">' +
          '<h3>' + esc(p.title || 'タイトル未入力') + '</h3>' +
          '<div class="meta"><span class="pill">' + esc(p.sheet) + '</span>' + esc(p.id || '新規') + ' / ' + esc(p.spot || 'スポット未設定') + '</div>' +
          (p.note ? '<p class="meta">' + esc(p.note) + '</p>' : '') +
          '<div class="actions"><button class="primary" data-approve="' + i + '">承認する</button><button class="secondary" data-hide="' + i + '">非公開のまま</button></div>' +
        '</div>'
      ).join('');
      document.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => approve(Number(b.dataset.approve), true));
      document.querySelectorAll('[data-hide]').forEach(b => b.onclick = () => approve(Number(b.dataset.hide), false));
    }

    function approve(i, approved) {
      const p = state.pending[i];
      google.script.run.withSuccessHandler(res => {
        notice(res.message, true);
        load();
      }).withFailureHandler(e => notice(e.message, false)).承認状態を変更する({
        sheet: p.sheet,
        rowNumber: p.rowNumber,
        approved: approved
      });
    }

    function filePayload() {
      const f = $('file').files[0];
      if (!f) return Promise.resolve(null);
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ name: f.name, mimeType: f.type, bytes: reader.result });
        reader.onerror = reject;
        reader.readAsDataURL(f);
      });
    }

    $('addPhoto').onclick = async () => {
      $('addPhoto').disabled = true;
      try {
        const file = await filePayload();
        google.script.run.withSuccessHandler(res => {
          notice(res.message, true);
          $('title').value = '';
          $('driveFileId').value = '';
          $('file').value = '';
          $('description').value = '';
          load();
          $('addPhoto').disabled = false;
        }).withFailureHandler(e => {
          notice(e.message, false);
          $('addPhoto').disabled = false;
        }).写真を登録する({
          file: file,
          driveFileId: $('driveFileId').value,
          title: $('title').value,
          spot: $('spot').value,
          season: $('season').value,
          focus: $('focus').value,
          tags: checked('tags'),
          roles: checked('roles'),
          description: $('description').value,
          photographer: $('photographer').value,
          sortOrder: $('sortOrder').value,
          publish: false
        });
      } catch (e) {
        notice(e.message, false);
        $('addPhoto').disabled = false;
      }
    };

    $('reload').onclick = load;
    $('photoEdit').onchange = setPhotoFields;
    function currentPhoto() {
      return state.photos.find(p => p.label === $('photoEdit').value);
    }
    function setPhotoFields() {
      const p = currentPhoto() || {};
      $('photoPublish').checked = p.publish !== false;
      $('photoDownload').checked = p.downloadAllowed !== false;
      $('photoTitle').value = p.title || '';
      $('photoDescription').value = p.description || '';
      $('photoTags').value = p.tags || '';
      $('photoRoles').value = p.roles || '';
      $('photoSortOrder').value = p.sortOrder || '';
    }
    $('savePhoto').onclick = () => {
      const p = currentPhoto();
      if (!p) return notice('写真を選んでください。', false);
      google.script.run.withSuccessHandler(res => {
        notice(res.message, true);
        load();
      }).withFailureHandler(e => notice(e.message, false)).写真を保存する({
        rowNumber: p.rowNumber,
        id: p.id,
        title: $('photoTitle').value,
        description: $('photoDescription').value,
        tags: $('photoTags').value,
        roles: $('photoRoles').value,
        sortOrder: $('photoSortOrder').value,
        publish: $('photoPublish').checked,
        downloadAllowed: $('photoDownload').checked
      });
    };

    $('spotEdit').onchange = () => {
      const spot = state.spots.find(s => s.name === $('spotEdit').value) || {};
      $('spotCatch').value = spot.catch || '';
      $('body1').value = spot.body1 || '';
      $('body2').value = spot.body2 || '';
      $('body3').value = spot.body3 || '';
      $('body4').value = spot.body4 || '';
      $('heroPhotoId').value = spot.heroPhotoId || '';
    };
    $('saveSpot').onclick = () => {
      const spot = state.spots.find(s => s.name === $('spotEdit').value);
      if (!spot) return notice('スポットを選んでください。', false);
      google.script.run.withSuccessHandler(res => notice(res.message, true))
        .withFailureHandler(e => notice(e.message, false))
        .スポットを保存する({
          id: spot.id,
          catch: $('spotCatch').value,
          body1: $('body1').value,
          body2: $('body2').value,
          body3: $('body3').value,
          body4: $('body4').value,
          heroPhotoId: $('heroPhotoId').value,
          publish: spot.publish ? 'TRUE' : 'FALSE'
        });
    };

    load();
  </script>
</body>
</html>
